<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TV Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* FORÇA LANDSCAPE */
@media screen and (orientation: portrait) {
    body {
        transform: rotate(90deg);
        transform-origin: left top;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 0;
        left: 100%;
    }
}

.app {
    display: flex;
    width: 100%;
    height: 100%;
}

/* MENU LATERAL */
.sidebar {
    width: 22%;
    background: #000;
    padding: 15px 5px;
    overflow-y: auto;
}

.logo {
    text-align: center;
    margin-bottom: 15px;
}

.logo span {
    background: red;
    color: white;
    padding: 8px 16px;
    border-radius: 0;
    font-weight: bold;
    font-size: 20px;
}

.menu {
    display: flex;
    justify-content: space-around;
    font-size: 14px;
    margin-bottom: 20px;
    color: #aaa;
}

.channels {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}

.channel {
    background: #171515;
    border-radius: 5px;
    padding: 7px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

.channel.active {
    background: #170404;
    border-left: 5px solid #8B0000;
}

.channel img {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    object-fit: cover;
}

.channel span {
    color: #fff;
    font-size: 12px;
}

/* PLAYER */
.player-area {
    width: 65%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 90%;
    height: 100%;
    background: black;
}
</style>
</head>

<body>

<div class="app">

    <!-- MENU -->
 <div class="sidebar">

        <div class="channels" id="channels"></div>
    </div>

    <!-- PLAYER -->
    <div class="player-area">
        <video id="video" controls autoplay></video>
    </div>

</div>

<script>
const playlistUrl = "https://raw.githubusercontent.com/ManoLimah/Manoteste/refs/heads/main/ManoTV.m3u";
const channelsDiv = document.getElementById("channels");
const video = document.getElementById("video");

const OCULTAR_PRIMEIROS = 4;

fetch(playlistUrl)
.then(res => res.text())
.then(data => {
    const lines = data.split("\n");
    let canais = [];

    for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith("#EXTINF")) {
            const nome = lines[i].split(",").pop();
            const logoMatch = lines[i].match(/tvg-logo="([^"]+)"/);
            const logo = logoMatch ? logoMatch[1] : "";
            const url = lines[i + 1];

            canais.push({ nome, logo, url });
        }
    }

    // REMOVE os 4 primeiros
    canais = canais.slice(OCULTAR_PRIMEIROS);

    canais.forEach((c, i) => {
        const div = document.createElement("div");
        div.className = "channel";

        div.innerHTML = `
            <img src="${c.logo || 'https://via.placeholder.com/40'}">
            <span>${c.nome}</span>
        `;

        div.onclick = () => {
            document.querySelectorAll(".channel").forEach(el => el.classList.remove("active"));
            div.classList.add("active");
            video.src = c.url;
            video.play();
        };

        channelsDiv.appendChild(div);

        // ▶️ reproduz automaticamente o primeiro visível
        if (i === 0) {
            setTimeout(() => div.click(), 300);
        }
    });
});
</script>




<script>
function entrarTelaCheia() {
    const elem = document.documentElement;

    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
    }
}

// tenta entrar em tela cheia ao clicar em qualquer lugar
document.addEventListener("click", entrarTelaCheia, { once: true });
</script>



</body>
</html>
