<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TV Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* FORÇA PORTRAIT (em pé) */
@media screen and (orientation: landscape) {
    body {
        transform: rotate(-90deg);
        transform-origin: top left;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 0;
        left: 0;
    }
}

.app {
    display: flex;
    width: 100%;
    height: 100%;
}

/* ESCONDE MENU LATERAL */
.sidebar {
    display: none;
}

/* PLAYER OCUPA TELA TODA */
.player-area {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    background: black;
}
</style>
</head>

<body>

<div class="app">
    <!-- MENU OCULTO -->
    <div class="sidebar">
        <div class="channels" id="channels"></div>
    </div>

    <!-- PLAYER -->
    <div class="player-area">
        <video id="video" controls autoplay></video>
    </div>
</div>

<script>
const playlistUrl = "https://raw.githubusercontent.com/vittopayver/lista/refs/heads/main/tv.m3u8";
const channelsDiv = document.getElementById("channels");
const video = document.getElementById("video");

fetch(playlistUrl)
.then(res => res.text())
.then(data => {
    const lines = data.split("\n");
    let canais = [];

    for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith("#EXTINF")) {
            const nome = lines[i].split(",").pop();
            const logoMatch = lines[i].match(/tvg-logo="([^"]+)"/);
            const logo = logoMatch ? logoMatch[1] : "";
            const url = lines[i + 1];

            canais.push({ nome, logo, url });
        }
    }

    // REPRODUZ automaticamente o primeiro canal
    if (canais.length > 0) {
        video.src = canais[0].url;
        video.play();
    }
});
</script>

<script>
function entrarTelaCheia() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
    }
}

// tenta entrar em tela cheia ao carregar
document.addEventListener("DOMContentLoaded", entrarTelaCheia);
</script>

</body>
</html>
